<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miracle Morning & Habit Tower</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #f7fafc; 
            color: #2d3748; 
            padding: 16px;
            max-width: 600px; 
            margin: 0 auto; 
            overflow-x: hidden; 
        }

        /* 상단 네비게이션 (2개 슬라이드) */
        .top-nav { display: flex; justify-content: space-around; gap: 6px; margin-bottom: 16px; background-color: #edf2f7; padding: 5px; border-radius: 12px; }
        .top-nav-item { flex: 1; padding: 10px 4px; font-size: 0.85rem; font-weight: 700; border: none; border-radius: 8px; background: transparent; color: #718096; cursor: pointer; transition: all 0.2s ease; text-align: center; touch-action: manipulation; }
        .top-nav-item.active { background-color: #3182ce; color: #ffffff; box-shadow: 0 2px 6px rgba(49, 130, 206, 0.3); }

        /* 2개 슬라이드 컨테이너 (너비 200%) */
        .slider-container { display: flex; width: 200%; transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1); }
        .slide-page { width: 50%; padding: 4px; flex-shrink: 0; }

        /* 미라클 모닝 세션 카드들 */
        .mm-card-container { display: flex; flex-direction: column; gap: 14px; }
        .mm-card { 
            background: #ffffff; border-radius: 14px; padding: 16px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid #e2e8f0; 
        }
        .mm-card-header { font-size: 1rem; font-weight: 700; color: #2d3748; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
        
        .mm-textarea { 
            width: 100%; min-height: 90px; padding: 10px; 
            border: 1px solid #e2e8f0; border-radius: 8px; font-size: 0.85rem; 
            line-height: 1.5; color: #2d3748; resize: none; outline: none; 
            background-color: #f8fafc; font-family: inherit; margin-top: 6px;
        }
        .mm-textarea:focus { border-color: #3182ce; background-color: #ffffff; }

        .quote-box { background-color: #ebf8ff; border-left: 4px solid #3182ce; padding: 10px; border-radius: 6px; font-size: 0.82rem; color: #2b6cb0; margin-bottom: 8px; line-height: 1.4; }
        .quote-source { font-size: 0.72rem; color: #4a5568; text-align: right; margin-top: 4px; font-weight: 600; }

        .btn-save { background-color: #3182ce; color: white; border: none; font-weight: 600; padding: 6px 12px; font-size: 0.75rem; border-radius: 6px; cursor: pointer; float: right; margin-top: 6px; }
        .save-toast { font-size: 0.75rem; color: #38a169; font-weight: 600; }

        /* 습관 탑 스타일 */
        h1 { text-align: center; font-size: 1.3rem; margin-bottom: 14px; font-weight: 700; color: #2d3748; }
        .card { background: #ffffff; border: 1px solid #e9ecef; border-radius: 10px; padding: 12px; margin-bottom: 14px; font-size: 0.8rem; }
        .form-group { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        input, select, button { padding: 8px 10px; font-size: 0.8rem; border: 1px solid #dde2e5; border-radius: 6px; outline: none; }
        button { background-color: #3182ce; color: white; border: none; font-weight: 600; cursor: pointer; touch-action: manipulation; }

        .tower-grid { display: flex; gap: 6px; width: 100%; justify-content: space-between; align-items: stretch; }
        .category-wrapper { flex: 1; display: flex; flex-direction: column; gap: 6px; }
        .tower-col { flex: 1; display: flex; flex-direction: column; border-radius: 10px; padding: 8px 4px; min-height: 350px; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
        .col-study { background-color: #fff5f5; border: 1px solid #fed7d7; }
        .col-hobby { background-color: #fffaf0; border: 1px solid #feebc8; }
        .col-body  { background-color: #ebf8ff; border: 1px solid #bee3f8; }
        .col-mind  { background-color: #faf5ff; border: 1px solid #e9d8fd; }

        .tower-header { text-align: center; font-size: 0.72rem; font-weight: 700; padding-bottom: 6px; border-bottom: 2px solid rgba(0,0,0,0.05); }
        .tower-blocks { display: flex; flex-direction: column-reverse; width: 100%; align-items: center; margin-top: auto; gap: 4px; }

        .habit-block { 
            width: 94%; border-radius: 6px; padding: 6px 4px; font-size: 0.65rem; text-align: center; 
            word-break: break-all; background: #ffffff; font-weight: 600;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
            cursor: pointer; user-select: none; transition: all 0.2s ease;
            touch-action: manipulation;
        }
        .habit-block:active { transform: scale(0.95); }
        
        /* 비활성화 상태 스타일링 */
        .habit-block.inactive {
            opacity: 0.4;
            background-color: #edf2f7 !important;
            border-color: #cbd5e0 !important;
            color: #a0aec0 !important;
            box-shadow: none;
        }

        .block-study { color: #e53e3e; border: 1px solid #feb2b2; }
        .block-hobby { color: #dd6b20; border: 1px solid #fbd38d; }
        .block-body  { color: #3182ce; border: 1px solid #90cdf4; }
        .block-mind  { color: #805ad5; border: 1px solid #d6bcfa; }

        .battery-gauge { display: flex; gap: 2px; align-items: center; justify-content: center; }
        .gauge-bar { width: 7px; height: 3.5px; border-radius: 1px; background-color: #e2e8f0; border: 0.5px solid #cbd5e0; }
        .gauge-bar.filled { background-color: currentColor; border-color: transparent; opacity: 0.85; }

        .waiting-zone { height: 150px; flex-shrink: 0; background-color: #f8f9fa; border: 1.5px dashed #cbd5e0; border-radius: 8px; padding: 6px 2px; text-align: center; overflow-y: auto; display: flex; flex-direction: column; align-items: center; }
        .waiting-title { font-size: 0.58rem; color: #718096; font-weight: 700; margin-bottom: 4px; flex-shrink: 0; }
        .waiting-chip { background-color: #ffffff; border-radius: 4px; padding: 6px 4px; margin: 2px auto; width: 90%; font-size: 0.6rem; color: #4a5568; border: 1px solid #e2e8f0; text-align: center; cursor: pointer; user-select: none; touch-action: manipulation; display: flex; flex-direction: column; align-items: center; gap: 2px; }

        /* 모달 스타일 */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.4); display: flex; align-items: center; justify-content: center; z-index: 2000; }
        .modal-card { background: #ffffff; width: 85%; max-width: 320px; border-radius: 14px; padding: 20px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
        .modal-title { font-size: 1rem; font-weight: 700; margin-bottom: 12px; }
        .modal-btn-group { display: flex; gap: 6px; margin-bottom: 12px; }
        .modal-btn { flex: 1; padding: 8px 0; font-size: 0.78rem; border-radius: 6px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const API_BASE_URL = "https://mm-back.onrender.com";
        const CATEGORIES = ["공부", "취미", "외면", "내면"];
        const CAT_ICONS = { "공부": "📚", "취미": "🎨", "외면": "💪", "내면": "🧘" };
        const CAT_CLASSES = { "공부": "study", "취미": "hobby", "외면": "body", "내면": "mind" };
        const LEVEL_ORDER = { "하": 1, "중": 2, "상": 3 };

        function LevelGauge({ level }) {
            const filledCount = level === "상" ? 3 : level === "중" ? 2 : 1;
            return (
                <div className="battery-gauge">
                    {[1, 2, 3].map(num => (
                        <div key={num} className={`gauge-bar ${num <= filledCount ? 'filled' : ''}`} />
                    ))}
                </div>
            );
        }

        function HabitBlockItem({ item, cls, isActive, onToggleActive, onLongPress }) {
            const timerRef = React.useRef(null);
            const isLongPressRef = React.useRef(false);

            const handlePointerDown = () => {
                isLongPressRef.current = false;
                timerRef.current = setTimeout(() => {
                    isLongPressRef.current = true;
                    if (window.navigator && window.navigator.vibrate) {
                        window.navigator.vibrate(30);
                    }
                    onLongPress(item);
                }, 400);
            };

            const handlePointerUp = () => {
                if (timerRef.current) clearTimeout(timerRef.current);
            };

            const handleClick = (e) => {
                e.stopPropagation();
                if (isLongPressRef.current) {
                    isLongPressRef.current = false;
                    return;
                }
                onToggleActive(item.id);
            };

            return (
                <div 
                    className={`habit-block block-${cls} ${!isActive ? 'inactive' : ''}`}
                    onPointerDown={handlePointerDown}
                    onPointerUp={handlePointerUp}
                    onPointerLeave={handlePointerUp}
                    onPointerCancel={handlePointerUp}
                    onClick={handleClick}
                >
                    <span>{item.title}</span>
                    <LevelGauge level={item.level} />
                </div>
            );
        }

        function App() {
            const [currentPage, setCurrentPage] = React.useState(0);
            
            // 텍스트 통합 데이터 상태
            const [texts, setTexts] = React.useState({
                명상: "",
                운동: "",
                사명서: localStorage.getItem("my_mission_statement") || "",
                감사: ""
            });
            const [randomQuotes, setRandomQuotes] = React.useState([]);
            const [saveToast, setSaveToast] = React.useState("");

            const [habitsData, setHabitsData] = React.useState({ owned: {}, wish: {}, all: [] });
            const [inactiveIds, setInactiveIds] = React.useState(new Set());
            const [editModalItem, setEditModalItem] = React.useState(null); 

            const [title, setTitle] = React.useState("");
            const [category, setCategory] = React.useState("공부");
            const [status, setStatus] = React.useState("보유 습관");
            const [level, setLevel] = React.useState("중");

            // API 텍스트 데이터 로드
            const loadTexts = async () => {
                try {
                    const res = await fetch(`${API_BASE_URL}/api/texts`);
                    if (res.ok) {
                        const data = await res.json();
                        setTexts(prev => ({ ...prev, ...data }));
                    }
                } catch (err) {
                    console.error("텍스트 로드 실패:", err);
                }
            };

            // API 명언/구절 불러오기
            const loadQuotes = async () => {
                try {
                    const res = await fetch(`${API_BASE_URL}/api/quotes/random`);
                    if (res.ok) {
                        const data = await res.json();
                        if (data.quotes) setRandomQuotes(data.quotes);
                    }
                } catch (err) {
                    console.error("명언 로드 실패:", err);
                }
            };

            const loadHabits = async () => {
                try {
                    const res = await fetch(`${API_BASE_URL}/api/habits`);
                    const data = await res.json();
                    setHabitsData(data);
                } catch (err) {
                    console.error("습관 로드 실패:", err);
                }
            };

            React.useEffect(() => {
                loadHabits();
                loadTexts();
                loadQuotes();
                const interval = setInterval(loadHabits, 30000);
                return () => clearInterval(interval);
            }, []);

            // 텍스트 저장 핸들러
            const handleSaveText = async (categoryName) => {
                const content = texts[categoryName];
                if (categoryName === "사명서") {
                    localStorage.setItem("my_mission_statement", content);
                }

                try {
                    const res = await fetch(`${API_BASE_URL}/api/texts`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ category: categoryName, content })
                    });
                    if (res.ok) {
                        setSaveToast(`✓ ${categoryName} 저장 완료!`);
                    } else {
                        setSaveToast(`✓ ${categoryName} 저장됨 (로컬)`);
                    }
                } catch (err) {
                    setSaveToast(`✓ ${categoryName} 저장됨 (로컬)`);
                }
                setTimeout(() => setSaveToast(""), 2000);
            };

            const handleToggleActive = (id) => {
                setInactiveIds(prev => {
                    const next = new Set(prev);
                    if (next.has(id)) next.delete(id);
                    else next.add(id);
                    return next;
                });
            };

            const handleChangeLevel = async (item, newLevel) => {
                try {
                    await fetch(`${API_BASE_URL}/api/habits/${item.id}`, {
                        method: "PATCH",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ level: newLevel })
                    });
                    setEditModalItem(null);
                    loadHabits();
                } catch (err) {
                    console.error("수준 변경 실패:", err);
                }
            };

            const handleDeleteFromModal = async (id) => {
                try {
                    await fetch(`${API_BASE_URL}/api/habits/${id}`, { method: "DELETE" });
                    setEditModalItem(null);
                    loadHabits();
                } catch (err) {
                    console.error("삭제 실패:", err);
                }
            };

            const handleAddHabit = async (e) => {
                e.preventDefault();
                if (!title.trim()) return;

                await fetch(`${API_BASE_URL}/api/habits`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ title, category, status, level })
                });

                setTitle("");
                loadHabits();
            };

            const handlePromoteToOwned = async (item) => {
                try {
                    await fetch(`${API_BASE_URL}/api/habits/${item.id}`, {
                        method: "PATCH",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ status: "보유 습관" })
                    });
                    loadHabits();
                } catch (err) {
                    console.error("승격 실패:", err);
                }
            };

            return (
                <div>
                    {/* 상단 2개 메인 네비게이션 */}
                    <div className="top-nav">
                        <button className={`top-nav-item ${currentPage === 0 ? 'active' : ''}`} onClick={() => setCurrentPage(0)}>🌅 미라클 모닝</button>
                        <button className={`top-nav-item ${currentPage === 1 ? 'active' : ''}`} onClick={() => setCurrentPage(1)}>🏛️ 습관 탑</button>
                    </div>

                    <div className="slider-container" style={{ transform: `translateX(-${currentPage * 50}%)` }}>
                        
                        {/* Slide 1: 미라클 모닝 메인 루틴 세션 */}
                        <div className="slide-page">
                            <div className="mm-card-container">
                                
                                {/* 1. Silence (명상) */}
                                <div className="mm-card">
                                    <div className="mm-card-header">
                                        <span>🧘‍♂️ Silence (명상)</span>
                                        <span className="save-toast">{saveToast}</span>
                                    </div>
                                    <textarea 
                                        className="mm-textarea" 
                                        placeholder="명상 후 마음의 상태나 감정을 기록하세요..."
                                        value={texts["명상"]} 
                                        onChange={(e) => setTexts({ ...texts, 명상: e.target.value })} 
                                    />
                                    <button className="btn-save" onClick={() => handleSaveText("명상")}>저장</button>
                                </div>

                                {/* 2. Exercise (운동) */}
                                <div className="mm-card">
                                    <div className="mm-card-header">
                                        <span>💪 Exercise (운동)</span>
                                    </div>
                                    <textarea 
                                        className="mm-textarea" 
                                        placeholder="오늘 한 운동 루틴(스트레칭, 푸시업 등)을 적어보세요..."
                                        value={texts["운동"]} 
                                        onChange={(e) => setTexts({ ...texts, 운동: e.target.value })} 
                                    />
                                    <button className="btn-save" onClick={() => handleSaveText("운동")}>저장</button>
                                </div>

                                {/* 3. Reading & Quote (독서 & 오늘의 문장) */}
                                <div className="mm-card">
                                    <div className="mm-card-header">
                                        <span>📖 Reading & Quote (독서)</span>
                                        <button style={{ background: 'none', border: 'none', color: '#3182ce', fontSize: '0.72rem', cursor: 'pointer' }} onClick={loadQuotes}>🔄 명언 갱신</button>
                                    </div>
                                    {randomQuotes.length > 0 ? (
                                        <div className="quote-box">
                                            "{randomQuotes[0].quote}"
                                            <div className="quote-source">- {randomQuotes[0].source}</div>
                                        </div>
                                    ) : (
                                        <div className="quote-box">"오늘을 특별하게 만들어라."</div>
                                    )}
                                </div>

                                {/* 4. Affirmation & Scribing (사명서 & 감사일기) */}
                                <div className="mm-card">
                                    <div className="mm-card-header">
                                        <span>📜 사명서 & 🙏 감사일기</span>
                                    </div>
                                    <textarea 
                                        className="mm-textarea" 
                                        style={{ minHeight: '120px' }}
                                        placeholder="[사명서 / 오늘 감사한 일 3가지]&#10;1. &#10;2. "
                                        value={texts["감사"]} 
                                        onChange={(e) => setTexts({ ...texts, 감사: e.target.value })} 
                                    />
                                    <button className="btn-save" onClick={() => handleSaveText("감사")}>저장</button>
                                </div>

                            </div>
                        </div>

                        {/* Slide 2: 습관 탑 */}
                        <div className="slide-page">
                            <h1>🏛️ 나의 습관 탑</h1>

                            <details className="card">
                                <summary>➕ 습관 블록 추가</summary>
                                <form onSubmit={handleAddHabit} className="form-group">
                                    <input type="text" placeholder="예: 하루 30분 독서" value={title} onChange={(e) => setTitle(e.target.value)} required />
                                    <select value={category} onChange={(e) => setCategory(e.target.value)}>
                                        {CATEGORIES.map(cat => <option key={cat} value={cat}>{CAT_ICONS[cat]} {cat}</option>)}
                                    </select>
                                    <select value={status} onChange={(e) => setStatus(e.target.value)}>
                                        <option value="보유 습관">보유 습관</option>
                                        <option value="만들고 싶은 습관">만들고 싶은 습관</option>
                                    </select>
                                    <select value={level} onChange={(e) => setLevel(e.target.value)}>
                                        <option value="상">수준: 상 (3칸)</option>
                                        <option value="중">수준: 중 (2칸)</option>
                                        <option value="하">수준: 하 (1칸)</option>
                                    </select>
                                    <button type="submit">저장하기</button>
                                </form>
                            </details>

                            <div className="tower-grid">
                                {CATEGORIES.map(cat => {
                                    const cls = CAT_CLASSES[cat];
                                    const owned = (habitsData.owned && habitsData.owned[cat]) || [];
                                    const wish = (habitsData.wish && habitsData.wish[cat]) || [];

                                    const sortedOwned = [...owned].sort((a, b) => 
                                        (LEVEL_ORDER[a.level] || 2) - (LEVEL_ORDER[b.level] || 2)
                                    );

                                    return (
                                        <div key={cat} className="category-wrapper">
                                            <div className={`tower-col col-${cls}`}>
                                                <div className="tower-header">
                                                    {CAT_ICONS[cat]} {cat}<br />
                                                    <span style={{ fontWeight: 'normal', fontSize: '0.55rem', color: '#718096' }}>({owned.length}개)</span>
                                                </div>
                                                <div className="tower-blocks">
                                                    {sortedOwned.map(item => (
                                                        <HabitBlockItem
                                                            key={item.id} 
                                                            item={item} 
                                                            cls={cls}
                                                            isActive={!inactiveIds.has(item.id)}
                                                            onToggleActive={handleToggleActive}
                                                            onLongPress={(targetItem) => setEditModalItem(targetItem)}
                                                        />
                                                    ))}
                                                </div>
                                            </div>
                                            <div className="waiting-zone">
                                                <div className="waiting-title">⏳ 대기 중</div>
                                                {wish.length > 0 ? (
                                                    wish.map(w => (
                                                        <div key={w.id} className="waiting-chip" onClick={() => handlePromoteToOwned(w)}>
                                                            <span>{w.title}</span>
                                                            <LevelGauge level={w.level} />
                                                        </div>
                                                    ))
                                                ) : (
                                                    <div style={{ fontSize: '0.55rem', color: '#a0aec0', margin: 'auto 0' }}>대기 없음</div>
                                                )}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </div>

                    {/* 습관 모달 */}
                    {editModalItem && (
                        <div className="modal-overlay" onClick={() => setEditModalItem(null)}>
                            <div className="modal-card" onClick={e => e.stopPropagation()}>
                                <div className="modal-title">⚙️ {editModalItem.title}</div>
                                
                                <p style={{ fontSize: '0.75rem', color: '#718096', marginBottom: '8px' }}>수준 변경</p>
                                <div className="modal-btn-group">
                                    <button className="modal-btn" style={{ backgroundColor: editModalItem.level === '상' ? '#3182ce' : '#e2e8f0', color: editModalItem.level === '상' ? '#fff' : '#4a5568' }} onClick={() => handleChangeLevel(editModalItem, '상')}>상 (3칸)</button>
                                    <button className="modal-btn" style={{ backgroundColor: editModalItem.level === '중' ? '#3182ce' : '#e2e8f0', color: editModalItem.level === '중' ? '#fff' : '#4a5568' }} onClick={() => handleChangeLevel(editModalItem, '중')}>중 (2칸)</button>
                                    <button className="modal-btn" style={{ backgroundColor: editModalItem.level === '하' ? '#3182ce' : '#e2e8f0', color: editModalItem.level === '하' ? '#fff' : '#4a5568' }} onClick={() => handleChangeLevel(editModalItem, '하')}>하 (1칸)</button>
                                </div>

                                <button style={{ backgroundColor: '#e53e3e', color: 'white', width: '100%', padding: '9px', borderRadius: '8px', marginBottom: '8px', border: 'none' }} onClick={() => handleDeleteFromModal(editModalItem.id)}>
                                    🗑️ 습관 삭제하기
                                </button>
                                
                                <button style={{ backgroundColor: '#cbd5e0', color: '#4a5568', width: '100%', padding: '8px', borderRadius: '8px', border: 'none' }} onClick={() => setEditModalItem(null)}>
                                    닫기
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
